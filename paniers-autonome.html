<meta name="apple-mobile-web-app-title" content="Paniers">
<title>Paniers</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f2f2f4;--acc:#e8590c;--mut:#777;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161618;--fg:#f1f1f1;--card:#26262a;--acc:#ff8a3d;--mut:#999}}
:root[data-theme="dark"]{--bg:#161618;--fg:#f1f1f1;--card:#26262a;--acc:#ff8a3d;--mut:#999}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,Helvetica,Arial,sans-serif;padding:16px;max-width:480px;margin:0 auto}
h1{font-size:15px;font-weight:500;color:var(--mut);margin:4px 0;text-align:center}
.total{font-size:96px;font-weight:700;text-align:center;line-height:1;color:var(--acc)}
.sub{text-align:center;color:var(--mut);margin-bottom:14px}
.q{display:flex;gap:6px;margin-bottom:12px}
.q button{flex:1;padding:10px 0;border:0;border-radius:10px;background:var(--card);color:var(--fg);font-size:15px}
.q button.on{background:var(--acc);color:#fff;font-weight:600}
.pts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pts button{padding:28px 0;font-size:30px;font-weight:700;border:0;border-radius:16px;background:var(--acc);color:#fff}
.pts button:active{opacity:.7}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}.stats button{padding:14px 4px;border:0;border-radius:14px;background:var(--card);color:var(--fg);font-size:13px}.stats b{font-size:26px;color:var(--acc)}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}.card .big{font-size:28px;font-weight:700;color:var(--acc)}.mut{color:var(--mut);font-size:13px}.card button{margin-top:8px;border:0;background:none;color:var(--mut);font-size:13px;padding:4px 0}
.row{display:flex;gap:10px;margin:12px 0}
.row button{flex:1;padding:12px;border:0;border-radius:12px;background:var(--card);color:var(--fg);font-size:15px}
input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--card);background:var(--card);color:var(--fg);font-size:15px;margin-bottom:10px}
ul{list-style:none;padding:0;margin:0}
li{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--card);font-size:15px}
li span:last-child{color:var(--mut)}
</style>
</head>
<body>
<input id="name" placeholder="Match / adversaire (facultatif)">
<h1>Points marqués</h1>
<div class="total" id="total">0</div>
<div class="sub" id="sub"></div>
<div class="q" id="q"></div>
<div class="pts">
<button data-p="1">+1</button><button data-p="2">+2</button><button data-p="3">+3</button>
</div>
<div class="stats" id="stats"></div>
<div class="row"><button id="undo">Annuler le dernier</button><button id="reset">Terminer le match</button></div>
<ul id="log"></ul>
<h1 style="margin-top:28px">Historique des matchs</h1>
<div id="hist"></div>
<script>
var ST=[["i","Interceptions"],["b","Blocks"],["a","Assists"],["r","Rebonds"]],K="paniers-v1",s={name:"",q:1,log:[]},armed=false;
try{var r=localStorage.getItem(K);if(r)s=JSON.parse(r)}catch(e){}
if(!s.hist)s.hist=[];
var delId=0;
function esc(t){return String(t).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function sm(log){var r={p:0,n:0,p1:0,p2:0,p3:0,i:0,b:0,a:0,r:0};log.forEach(function(e){if(e.p){r.p+=e.p;r.n++;r["p"+e.p]++}else r[e.s]++});return r}
function pl(m){return "1 pt ×"+m.p1+" · 2 pts ×"+m.p2+" · 3 pts ×"+m.p3}
function line(m){return "Interc. "+m.i+" · Blocks "+m.b+" · Assists "+m.a+" · Rebonds "+m.r}
function save(){try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}}
function render(){
 var t=s.log.reduce(function(a,b){return a+(b.p||0)},0);
 document.getElementById("total").textContent=t;
 var n=s.log.filter(function(e){return e.p}).length;
 document.getElementById("sub").textContent=n+(n>1?" paniers":" panier")+(n?" · "+pl(sm(s.log)):"");
 document.getElementById("name").value=s.name||"";
 var q=document.getElementById("q");q.innerHTML="";
 [1,2,3,4].forEach(function(i){var b=document.createElement("button");b.textContent="Q"+i;if(i===s.q)b.className="on";b.onclick=function(){s.q=i;save();render()};q.appendChild(b)});
 var ul=document.getElementById("log");ul.innerHTML="";
 var st=document.getElementById("stats");st.innerHTML="";
 ST.forEach(function(x){var c=s.log.filter(function(e){return e.s===x[0]}).length;var b=document.createElement("button");b.innerHTML="<b>"+c+"</b><br>"+x[1];b.onclick=function(){add({s:x[0]})};st.appendChild(b)});
 s.log.slice().reverse().forEach(function(e){var lab=e.p?"+"+e.p:ST.filter(function(x){return x[0]===e.s})[0][1];var li=document.createElement("li");li.innerHTML="<span>"+lab+"</span><span>Q"+e.q+" · "+e.t+"</span>";ul.appendChild(li)});
 document.getElementById("reset").textContent=armed?"Confirmer ?":"Terminer le match";
 var H=document.getElementById("hist");H.innerHTML="";
 if(!s.hist.length){H.innerHTML='<div class="sub">Aucun match enregistré</div>'}else{
  var all={p:0,n:0,p1:0,p2:0,p3:0,i:0,b:0,a:0,r:0};
  s.hist.forEach(function(m){var x=sm(m.log);for(var k in all)all[k]+=x[k]});
  var c=document.createElement("div");c.className="card";
  c.innerHTML="<b>Cumul · "+s.hist.length+" match"+(s.hist.length>1?"s":"")+"</b><div class='big'>"+all.p+" pts</div><div class='mut'>Moy. "+(all.p/s.hist.length).toFixed(1).replace(".",",")+" pts/match</div><div class='mut'>"+pl(all)+"</div><div class='mut'>"+line(all)+"</div>";
  H.appendChild(c);
  s.hist.forEach(function(m){var x=sm(m.log);var d=document.createElement("div");d.className="card";
   d.innerHTML="<b>"+esc(m.name||"Match")+"</b> <span class='mut'>"+m.date+"</span><div class='big'>"+x.p+" pts</div><div class='mut'>"+pl(x)+"</div><div class='mut'>"+line(x)+"</div>";
   var del=document.createElement("button");del.textContent=delId===m.id?"Confirmer ?":"Supprimer";
   del.onclick=function(){if(delId!==m.id){delId=m.id;render();setTimeout(function(){delId=0;render()},3000);return}s.hist=s.hist.filter(function(h){return h.id!==m.id});delId=0;save();render()};
   d.appendChild(del);H.appendChild(d)});
 }
}
function add(o){var d=new Date(),h=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);o.q=s.q;o.t=h;s.log.push(o);save();render();if(navigator.vibrate)navigator.vibrate(30)}
document.querySelectorAll(".pts button").forEach(function(b){b.onclick=function(){add({p:+b.dataset.p})}});
document.getElementById("undo").onclick=function(){s.log.pop();save();render()};
document.getElementById("reset").onclick=function(){
 if(!armed){armed=true;render();setTimeout(function(){armed=false;render()},3000);return}
 if(s.log.length)s.hist.unshift({id:Date.now(),name:s.name,date:new Date().toLocaleDateString("fr-FR"),log:s.log});
 s={name:"",q:1,log:[],hist:s.hist};armed=false;save();render()};
document.getElementById("name").oninput=function(e){s.name=e.target.value;save()};
render();
</script>
</body>
</html>
